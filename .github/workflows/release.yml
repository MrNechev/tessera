name: Release

# Push a tag like v0.1.0 to build every package and publish a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: deb, rpm & AppImage
    runs-on: ubuntu-24.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      NO_STRIP: true
    steps:
      - uses: actions/checkout@v7
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libheif-dev libdav1d-dev nasm patchelf \
            libfuse2 file xdg-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Tessera ${{ github.ref_name }}
          releaseBody: |
            See the [changelog](https://github.com/MrNechev/tessera/blob/main/CHANGELOG.md) for what's new.

            **Which file do I need?**
            - Fedora / openSUSE / RHEL: the `.rpm`
            - Debian / Ubuntu / Mint / Pop!_OS: the `.deb`
            - Any distribution: the `.AppImage` (make it executable, then run it) or the `.flatpak` bundle
          releaseDraft: false
          prerelease: true
          args: --bundles deb,rpm,appimage

  flatpak:
    name: Flatpak bundle
    needs: linux
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: Tessera_${{ github.ref_name }}_x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.mrnechev.Tessera.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: Tessera_${{ github.ref_name }}_x86_64.flatpak
