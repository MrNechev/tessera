name: Release

# Push a tag like v0.1.0 to build every package and publish a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  linux:
    name: deb, rpm & AppImage
    runs-on: ubuntu-24.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      NO_STRIP: true
    steps:
      - uses: actions/checkout@v7
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libheif-dev libdav1d-dev nasm patchelf \
            libheif-plugin-libde265 file xdg-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ship libheif's HEVC decoder inside the AppImage so it can open HEIC photos.
      - run: packaging/appimage/stage-heif-plugin.sh
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Tessera ${{ github.ref_name }}
          releaseBody: |
            See the [changelog](https://github.com/MrNechev/tessera/blob/main/CHANGELOG.md) for what's new.

            **Which file do I need?**
            - Fedora / openSUSE / RHEL: the `.rpm`
            - Debian / Ubuntu / Mint / Pop!_OS: the `.deb`
            - Any distribution: the `.AppImage` (make it executable, then run it) or the `.flatpak` bundle
            - A server (web app in Docker): `docker-compose.yml` + `env.example` below, image `ghcr.io/mrnechev/tessera:${{ github.ref_name }}` (see the [Docker guide](https://github.com/MrNechev/tessera/blob/main/docs/DOCKER.md))
          releaseDraft: false
          prerelease: true
          args: --bundles deb,rpm,appimage --config packaging/appimage/tauri.appimage.conf.json
          uploadUpdaterJson: false

  flatpak:
    name: Flatpak
    needs: linux
    uses: ./.github/workflows/flatpak.yml
    with:
      release-tag: ${{ github.ref_name }}

  docker:
    name: Docker image
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/mrnechev/tessera:${{ env.VERSION }}
            ghcr.io/mrnechev/tessera:latest
          labels: |
            org.opencontainers.image.source=https://github.com/MrNechev/tessera
            org.opencontainers.image.description=Tessera: collages, image tools, a media library, documents and presentations as a self-hosted web app
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attach the compose files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp packaging/docker/.env.example env.example
          gh release upload "${{ github.ref_name }}" packaging/docker/docker-compose.yml env.example --clobber
