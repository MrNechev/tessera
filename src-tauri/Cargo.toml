[package]
name = "tessera"
description = "Creative photo collage studio and image Swiss Army knife"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
default-run = "tessera"

[lib]
name = "tessera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["heif"]
# HEIC/HEIF import via the system libheif.
heif = ["tessera-imaging/heif"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-window-state = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
dirs = "7"
rayon = "1.12"
semver = "1"
ureq = { version = "3", features = ["json"] }
blake3 = "1"
base64 = "0.22"
image = { version = "0.25.10", default-features = false }
tessera-imaging = { path = "../crates/tessera-imaging" }
