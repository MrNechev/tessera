[package]
name = "tessera"
description = "Creative photo collage studio and image Swiss Army knife"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
default-run = "tessera"

[lib]
name = "tessera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["heif"]
# HEIC/HEIF import via the system libheif.
heif = ["tessera-core/heif"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-window-state = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
url = "2"
tessera-core = { path = "../crates/tessera-core" }

# Native print dialog with the project's paper size (same versions Tauri uses).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"
