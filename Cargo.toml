[workspace]
resolver = "2"
members = ["src-tauri", "crates/tessera-imaging"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/MrNechev/tessera"
authors = ["Tessera contributors"]
rust-version = "1.89"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

# Image codecs are painfully slow unoptimized; keep dev builds usable.
[profile.dev.package."*"]
opt-level = 3
