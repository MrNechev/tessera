[package]
name = "tessera-core"
description = "Tessera's engine: libraries, media, documents, tools and the HTTP API (shared by the desktop app and the server)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["heif"]
heif = ["tessera-imaging/heif"]

[dependencies]
tessera-imaging = { path = "../tessera-imaging" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-deflate", "catch-panic"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "server-graceful", "service", "http1", "http2"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
tracing = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
notify = "8"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
base64 = "0.22"
hex = "0.4"
rand = "0.9"
chrono = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
mime_guess = "2"
flate2 = "1"
form_urlencoded = "1"
percent-encoding = "2"
libc = "0.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
x509-parser = { version = "0.18", features = ["verify"] }
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
time = "0.3"

[dev-dependencies]
tempfile = "3"
